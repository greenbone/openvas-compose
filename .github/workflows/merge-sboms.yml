name: Merge SBOMs

on:
  workflow_dispatch:
  push:
    branches: main
    paths:
      - "**/sboms/**"
      - ".github/workflows/merge-sboms.yml"
      - "!**/*-merged-sbom.json"

concurrency:
  group: merge-sboms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{ secrets.GREENBONE_BOT_TOKEN }}

      - name: Install GO
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.25'

      - name: Install sbomasm
        run: go install github.com/interlynk-io/sbomasm/v2@v2.0.4

      - name: Set git name, mail and origin
        uses: greenbone/actions/set-github-user@v3
        with:
          user: ${{ secrets.GREENBONE_BOT }}
          mail: ${{ secrets.GREENBONE_BOT_MAIL }}
          token: ${{ secrets.GREENBONE_BOT_TOKEN }}

      - name: Merge and commit
        shell: bash
        run: |
          shopt -s globstar nullglob

          changed=0

          for dir in **/sboms; do
            version_dir="${dir%/sboms}"
            version="${version_dir##*/}"
            product="${version_dir%/*/*}"
            product="${product##*/}"
            output="$version_dir/$product-$version-merged-sbom.json"

            files=("$dir"/*)
            [ ${#files[@]} -gt 0 ] || continue
            [ ! -f "$output" ] || continue

            echo "Merging $product/$version"
            "$(go env GOPATH)/bin/sbomasm" assemble -t "container" -n "$product" -v "$version" -o "$output" "${files[@]}"
            changed=1
          done

          [ "$changed" -eq 1 ] || exit 0

          git add **/*-merged-sbom.json
          git diff --cached --quiet && exit 0

          git commit -m "Change: update merged SBOMs [skip ci]"

          git push || {
            sleep $((RANDOM % 30 + 1))
            git pull --rebase
            git push
          }
