# OpenSearch: single-node cluster with OpenID (Keycloak) + basic auth.
# The privileged sysctl init container sets vm.max_map_count (required by the
# JVM). Remove it if your nodes already set it or if your cluster forbids
# privileged containers (and set it at the node level instead).
---
apiVersion: v1
kind: Service
metadata:
  name: opensearch
  namespace: security-intelligence
spec:
  selector:
    app.kubernetes.io/name: opensearch
  ports:
    - name: http
      port: 9200
      targetPort: 9200
    - name: transport
      port: 9300
      targetPort: 9300
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensearch
  namespace: security-intelligence
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opensearch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opensearch
    spec:
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        runAsNonRoot: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: opensearch
        - name: secrets
          secret:
            secretName: si-secrets
            items:
              - key: OPENSEARCH_INITIAL_ADMIN_PASSWORD
                path: OPENSEARCH_INITIAL_ADMIN_PASSWORD
      initContainers:
        - name: sysctl
          image: busybox:1.36
          command: ["sysctl", "-w", "vm.max_map_count=262144"]
          securityContext:
            privileged: true
            runAsUser: 0
            runAsNonRoot: false
        - name: wait-for-keycloak
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z keycloak 8080; do echo waiting for keycloak; sleep 3; done; echo keycloak ready"]
      containers:
        - name: opensearch
          image: packages.greenbone.net/opensight/opensight-opensearch:2.22.0@sha256:665dddea4c8549b49fced970458d05db190ee6b962aad3db3821aec279679119
          imagePullPolicy: IfNotPresent
          env:
            - name: node.name
              value: opensight
            - name: cluster.name
              value: opensight-cluster
            - name: discovery.type
              value: single-node
            - name: network.host
              value: 0.0.0.0
            - name: plugins.security.disabled
              value: "false"
            - name: AUTH_TYPE
              value: OPENID_AND_BASIC
            - name: KEYCLOAK_URL
              valueFrom:
                configMapKeyRef:
                  name: si-env
                  key: KEYCLOAK_INTERNAL_BASE_URL
            - name: OPENSEARCH_JAVA_OPTS
              value: -Xms3g -Xmx3g
            - name: DISABLE_INSTALL_DEMO_CONFIG
              value: "true"
            - name: cluster.routing.allocation.disk.watermark.low
              value: "96%"
            - name: cluster.routing.allocation.disk.watermark.high
              value: "97%"
            - name: cluster.routing.allocation.disk.watermark.flood_stage
              value: "98%"
          volumeMounts:
            - name: data
              mountPath: /usr/share/opensearch/data
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - 'curl -k -u admin:$(cat /run/secrets/OPENSEARCH_INITIAL_ADMIN_PASSWORD) --no-progress-meter --fail-with-body https://localhost:9200/_cluster/health?wait_for_status=yellow && echo " health ok"'
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              cpu: "1"
              memory: "3Gi"
            limits:
              cpu: "4"
              memory: "6Gi"