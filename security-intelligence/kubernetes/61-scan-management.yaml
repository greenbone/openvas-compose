# Scan Management (from the management-console dev bundle 0.1.2-alpha.390).
# scan-control-backend serves /api/scan-management, scan-management-frontend
# serves /scan-management. Dev-stage images, digest-pinned as shipped upstream.
---
apiVersion: v1
kind: Service
metadata:
  name: scan-control-backend
  namespace: security-intelligence
spec:
  selector:
    app.kubernetes.io/name: scan-control-backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: scan-management-frontend
  namespace: security-intelligence
spec:
  selector:
    app.kubernetes.io/name: scan-management-frontend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scan-control-backend
  namespace: security-intelligence
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: scan-control-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scan-control-backend
    spec:
      securityContext:
        runAsUser: 10035
        runAsGroup: 10035
        runAsNonRoot: true
        supplementalGroups: [10031]
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "until nc -z management-console-postgres 5432; do sleep 2; done"]
        - name: wait-for-keycloak
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "until nc -z keycloak 8080; do sleep 2; done"]
      containers:
        - name: scan-control-backend
          securityContext:
            capabilities:
              drop: ["ALL"]
          image: packages.greenbone.net/opensight-management-console-dev/scan-control-backend:0.0.2-alpha15@sha256:84ebd8a2465746392a4cd4ddf269106a3caebbc052aadccebddd09bd93ffab9d
          imagePullPolicy: IfNotPresent
          env:
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: si-env
                  key: MANAGEMENT_CONSOLE_DB_USER
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: si-secrets
                  key: management-console-db-password
            - name: ENC_KEY
              valueFrom:
                secretKeyRef:
                  name: si-secrets
                  key: scan-control-encryption-key
            - name: CATALOG_SYNC_CONCURRENCY
              value: "1"
            - name: CATALOG_SYNC_INTERVAL
              value: 67s
            - name: CREDENTIAL_ENCRYPTION_ACTIVE_KEY_VERSION
              value: "1"
            - name: CREDENTIAL_ENCRYPTION_KEYS
              value: "1:$(ENC_KEY)"
            - name: HTTP_ADDRESS
              value: 0.0.0.0:8080
            - name: KEYCLOAK_ALLOWED_SIGNING_METHODS
              value: RS256
            - name: KEYCLOAK_EXPECTED_AUDIENCE
              value: account
            - name: KEYCLOAK_HTTP_TIMEOUT
              value: 10s
            - name: KEYCLOAK_JWT_LEEWAY
              value: 30s
            - name: KEYCLOAK_PUBLIC_URL
              valueFrom:
                configMapKeyRef:
                  name: si-env
                  key: KEYCLOAK_PUBLIC_AUTH_URL
            - name: KEYCLOAK_REALM
              valueFrom:
                configMapKeyRef:
                  name: si-env
                  key: KEYCLOAK_REALM
            - name: KEYCLOAK_URL
              valueFrom:
                configMapKeyRef:
                  name: si-env
                  key: KEYCLOAK_URL
            - name: LOG_LEVEL
              value: info
            - name: POSTGRES_URL
              value: "postgres://$(DB_USER):$(DB_PASS)@management-console-postgres:5432/scan_control_backend?sslmode=disable&search_path=public"
            - name: RECONCILIATION_CONCURRENCY
              value: "1"
            - name: RECONCILIATION_POLL_INTERVAL
              value: 43s
            - name: SCAN_UNIT_API_ALLOWED_HOSTS
              value: management-console-backend
            - name: SCAN_UNIT_BOOTSTRAP_ENABLED
              value: "false"
            - name: SENSOR_VERIFICATION_CONCURRENCY
              value: "1"
            - name: SENSOR_VERIFICATION_INTERVAL
              value: 43s
            - name: SENSOR_VERIFICATION_RETRY_DELAY
              value: 43s
            - name: TASK_COMMAND_CONCURRENCY
              value: "1"
            - name: TASK_COMMAND_DISPATCH_INTERVAL
              value: 7s
            - name: TASK_STATUS_POLL_INTERVAL
              value: 43s
          volumeMounts:
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: secrets
          secret:
            secretName: si-secrets
            items:
              - key: management-console-db-password
                path: scan-control-db-password
              - key: encryption-key
                path: scan-control-encryption-key
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scan-management-frontend
  namespace: security-intelligence
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: scan-management-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scan-management-frontend
    spec:
      securityContext:
        runAsUser: 10034
        runAsGroup: 10034
        runAsNonRoot: true
      containers:
        - name: scan-management-frontend
          securityContext:
            capabilities:
              drop: ["ALL"]
          image: packages.greenbone.net/opensight-management-console-dev/scan-management-frontend:0.21.1-alpha5@sha256:cde3dd08c5ec02ff5f2a5b88393b82104b02d8f1e85135e9d0be6cb9ba6b7d23
          imagePullPolicy: IfNotPresent
          env:
            - name: CSP_CONNECT_SRC
              value: ""
            - name: CSP_DEFAULT_SRC
              value: ""
            - name: CSP_FONT_SRC
              value: ""
            - name: CSP_FRAME_ANCESTORS_SRC
              value: ""
            - name: CSP_FRAME_SRC
              value: ""
            - name: CSP_IMG_SRC
              value: ""
            - name: CSP_MEDIA_SRC
              value: ""
            - name: CSP_OBJECT_SRC
              value: ""
            - name: CSP_SCRIPT_SRC
              value: ""
            - name: CSP_STYLE_SRC
              value: ""
            - name: FWS_CONFIG_BASEURL
              value: /api/scan-management
            - name: FWS_REALM_CONFIG_CLIENTID
              valueFrom:
                configMapKeyRef:
                  name: si-env
                  key: KEYCLOAK_WEB_CLIENT_NAME
            - name: FWS_REALM_CONFIG_MSPID
              valueFrom:
                configMapKeyRef:
                  name: si-env
                  key: KEYCLOAK_MASTER_REALM
            - name: FWS_REALM_CONFIG_REALM
              valueFrom:
                configMapKeyRef:
                  name: si-env
                  key: KEYCLOAK_REALM
            - name: FWS_REALM_CONFIG_URL
              value: /auth/
            - name: FWS_SIDE_NAV_MENU_SECTIONS
              valueFrom:
                configMapKeyRef:
                  name: si-env
                  key: FWS_NAV_MENU_SECTIONS
          readinessProbe:
            httpGet:
              path: /health/alive
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 50Mi
            limits:
              cpu: "1"
              memory: 256Mi