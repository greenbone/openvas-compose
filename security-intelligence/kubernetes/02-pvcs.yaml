# PersistentVolumeClaims for stateful data.
# All RWO on the default storage class. Sizes follow the upstream resource
# defaults; tune to your cluster. The metafeed cache is a download cache and
# could be switched to emptyDir if persistence across restarts is not needed.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: keycloak-postgres
  namespace: security-intelligence
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
