# Asset Management: postgres (+ upgrade init), backend (+ migration init),
# frontend, headless report browser.
---
apiVersion: v1
kind: Service
metadata:
  name: asset-management-postgres
  namespace: security-intelligence
spec:
  selector:
    app.kubernetes.io/name: asset-management-postgres
  ports:
    - name: pg
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: asset-management-backend
  namespace: security-intelligence
spec:
  selector:
    app.kubernetes.io/name: asset-management-backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: asset-management-frontend
  namespace: security-intelligence
spec:
  selector:
    app.kubernetes.io/name: asset-management-frontend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: asset-management-browser
  namespace: security-intelligence
spec:
  selector:
    app.kubernetes.io/name: asset-management-browser
  ports:
    - name: cdp
      port: 9222
      targetPort: 9222
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: asset-management-postgres
  namespace: security-intelligence
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: asset-management-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: asset-management-postgres
    spec:
      securityContext:
        runAsUser: 10002
        runAsGroup: 10002
        fsGroup: 10002
        runAsNonRoot: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: asset-management-postgres
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
        - name: secrets
          secret:
            secretName: si-secrets
      initContainers:
        - name: chown-data
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "chown -R 10002:10002 /var/lib/postgresql/data && chmod 700 /var/lib/postgresql/data"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
        - name: postgres-upgrade
          image: packages.greenbone.net/opensight/opensight-postgres:17.10.6@sha256:a2c6bfe6a91a64955f0531c41c83fb434eeab95550e8cfa2ce37415a0c27bfb1
          imagePullPolicy: IfNotPresent
          command: ["upgradeversion", "inplace"]
          env:
            - name: POSTGRES_USER
              value: application-user
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: shm
              mountPath: /dev/shm
      containers:
        - name: postgres
          image: packages.greenbone.net/opensight/opensight-postgres:17.10.6@sha256:a2c6bfe6a91a64955f0531c41c83fb434eeab95550e8cfa2ce37415a0c27bfb1
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              value: application-user
            - name: POSTGRES_DB
              value: asset-management-backend
            - name: POSTGRES_PASSWORD_FILE
              value: /run/secrets/asset-management-db-password
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: shm
              mountPath: /dev/shm
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "application-user", "-d", "asset-management-backend"]
            initialDelaySeconds: 30
            periodSeconds: 5
          resources:
            requests:
              cpu: "250m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: asset-management-backend
  namespace: security-intelligence
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: asset-management-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: asset-management-backend
    spec:
      securityContext:
        runAsUser: 10021
        runAsGroup: 10021
        fsGroup: 10021
        runAsNonRoot: true
      volumes:
        - name: secrets
          secret:
            secretName: si-secrets
            items:
              - key: DB_PASSWORD
                path: DB_PASSWORD
              - key: TASK_REPORT_CRYPTO_V1_PASSWORD
                path: TASK_REPORT_CRYPTO_V1_PASSWORD
              - key: TASK_REPORT_CRYPTO_V1_SALT
                path: TASK_REPORT_CRYPTO_V1_SALT
              - key: ELASTIC_AUTH_PASS
                path: ELASTIC_AUTH_PASS
              - key: REPORT_PASSWORD
                path: REPORT_PASSWORD
              - key: ASSET_BACKEND_CLIENT_SECRET
                path: ASSET_BACKEND_CLIENT_SECRET
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z asset-management-postgres 5432; do echo waiting for postgres; sleep 2; done"]
        - name: wait-for-keycloak
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z keycloak 8080; do echo waiting for keycloak; sleep 3; done"]
        - name: wait-for-opensearch
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z opensearch 9200; do echo waiting for opensearch; sleep 3; done"]
        - name: migration
          image: packages.greenbone.net/opensight-asset/asset-management-backend:1.34.0@sha256:ec9564fcc3709d6598eb2f2a4ae15f3fdf6742c53c1aed1abb53d0331b2b40db
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: si-env
          env: &asset-backend-env
            - name: EXECUTION_MODE
              value: migration_only
            - name: BROWSER_SECURITY_HEADERS
              value: '{"Strict-Transport-Security":["max-age=31536000"],"X-Content-Type-Options":["nosniff"]}'
            - name: DEPENDENCIES_TIMEOUT
              value: "120"
            - name: DB_HOST
              value: asset-management-postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: si-env
                  key: ASSET_MANAGEMENT_DB_USER
            - name: ELASTIC_API_PORT
              value: "9200"
            - name: ELASTIC_HOST
              value: opensearch
            - name: ELASTIC_HTTPS
              value: "true"
            - name: ELASTIC_AUTH_METHOD
              value: openid
            - name: ELASTIC_AUTH_USER
              valueFrom:
                configMapKeyRef:
                  name: si-env
                  key: KEYCLOAK_OPENSEARCH_CLIENT_ID
            - name: HTTP_PORT
              value: "8080"
            - name: TASK_REPORT_CRYPTO_DEFAULT_DELEGATE_ID
              value: v2
            - name: KEYCLOAK_REALM
              valueFrom:
                configMapKeyRef:
                  name: si-env
                  key: KEYCLOAK_REALM
            - name: KEYCLOAK_WEBCLIENT_NAME
              valueFrom:
                configMapKeyRef:
                  name: si-env
                  key: KEYCLOAK_WEB_CLIENT_NAME
            - name: KEYCLOAK_PUBLIC_URL
              valueFrom:
                configMapKeyRef:
                  name: si-env
                  key: KEYCLOAK_PUBLIC_AUTH_URL
            - name: GIN_MODE
              value: release
            - name: LOG_JSON
              value: "true"
            - name: LOG_LEVEL
              value: debug
            - name: GORM_LOGGING
              value: "false"
            - name: PROFILE
              value: docker
            - name: REPORT_SOURCE_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: si-env
                  key: REPORT_SOURCE_BASE_URL
            - name: REPORT_AUTH_URL
              valueFrom:
                configMapKeyRef:
                  name: si-env
                  key: KEYCLOAK_PUBLIC_AUTH_URL
            - name: REPORT_USERNAME
              value: reporting
            - name: REPORT_IGNORE_CERT_ERRORS
              value: "true"
            - name: REMOTE_BROWSER_URL
              value: http://asset-management-browser:9222/
            - name: NOTIFICATION_ADDRESS
              value: http://notification-service:8085
          volumeMounts:
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
      containers:
        - name: backend
          image: packages.greenbone.net/opensight-asset/asset-management-backend:1.34.0@sha256:ec9564fcc3709d6598eb2f2a4ae15f3fdf6742c53c1aed1abb53d0331b2b40db
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: si-env
          env:
            - name: BROWSER_SECURITY_HEADERS
              value: '{"Strict-Transport-Security":["max-age=31536000"],"X-Content-Type-Options":["nosniff"]}'
            - name: DEPENDENCIES_TIMEOUT
              value: "120"
            - name: DB_HOST
              value: asset-management-postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: si-env
                  key: ASSET_MANAGEMENT_DB_USER
            - name: ELASTIC_API_PORT
              value: "9200"
            - name: ELASTIC_HOST
              value: opensearch
            - name: ELASTIC_HTTPS
              value: "true"
            - name: ELASTIC_AUTH_METHOD
              value: openid
            - name: ELASTIC_AUTH_USER
              valueFrom:
                configMapKeyRef:
                  name: si-env
                  key: KEYCLOAK_OPENSEARCH_CLIENT_ID
            - name: HTTP_PORT
              value: "8080"
            - name: TASK_REPORT_CRYPTO_DEFAULT_DELEGATE_ID
              value: v2
            - name: KEYCLOAK_REALM
              valueFrom:
                configMapKeyRef:
                  name: si-env
                  key: KEYCLOAK_REALM
            - name: KEYCLOAK_WEBCLIENT_NAME
              valueFrom:
                configMapKeyRef:
                  name: si-env
                  key: KEYCLOAK_WEB_CLIENT_NAME
            - name: KEYCLOAK_PUBLIC_URL
              valueFrom:
                configMapKeyRef:
                  name: si-env
                  key: KEYCLOAK_PUBLIC_AUTH_URL
            - name: GIN_MODE
              value: release
            - name: LOG_JSON
              value: "true"
            - name: LOG_LEVEL
              value: debug
            - name: GORM_LOGGING
              value: "false"
            - name: PROFILE
              value: docker
            - name: REPORT_SOURCE_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: si-env
                  key: REPORT_SOURCE_BASE_URL
            - name: REPORT_AUTH_URL
              valueFrom:
                configMapKeyRef:
                  name: si-env
                  key: KEYCLOAK_PUBLIC_AUTH_URL
            - name: REPORT_USERNAME
              value: reporting
            - name: REPORT_IGNORE_CERT_ERRORS
              value: "true"
            - name: REMOTE_BROWSER_URL
              value: http://asset-management-browser:9222/
            - name: NOTIFICATION_ADDRESS
              value: http://notification-service:8085
          volumeMounts:
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
          readinessProbe:
            exec:
              command: ["wget", "-qT", "1", "--spider", "http://localhost:8080/health/alive"]
            initialDelaySeconds: 60
            periodSeconds: 5
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "2"
              memory: "4Gi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: asset-management-frontend
  namespace: security-intelligence
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: asset-management-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: asset-management-frontend
    spec:
      securityContext:
        runAsUser: 10023
        runAsGroup: 10023
        fsGroup: 10023
        runAsNonRoot: true
      containers:
        - name: frontend
          image: packages.greenbone.net/opensight-asset/asset-management-frontend:1.33.0@sha256:beb5b9cba0123ff3f612e26d21dad91db17334dc3bfd92fe3f4c6ce920758fca
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: si-env
          env:
            - name: CSP_CONNECT_SRC
              value: ""
            - name: CSP_DEFAULT_SRC
              value: ""
            - name: CSP_FONT_SRC
              value: ""
            - name: CSP_FRAME_ANCESTORS_SRC
              value: ""
            - name: CSP_FRAME_SRC
              value: ""
            - name: CSP_IMG_SRC
              value: ""
            - name: CSP_MEDIA_SRC
              value: ""
            - name: CSP_OBJECT_SRC
              value: ""
            - name: CSP_SCRIPT_SRC
              value: ""
            - name: CSP_STYLE_SRC
              value: ""
            - name: FWS_CONFIG_APPLIANCE_FETCH_INTERVAL
              value: "5000"
            - name: FWS_REALM_CONFIG_URL
              value: /auth/
            - name: FWS_REALM_CONFIG_CLIENTID
              valueFrom:
                configMapKeyRef:
                  name: si-env
                  key: KEYCLOAK_WEB_CLIENT_NAME
            - name: FWS_REALM_CONFIG_MSPID
              valueFrom:
                configMapKeyRef:
                  name: si-env
                  key: KEYCLOAK_MASTER_REALM
            - name: FWS_REALM_CONFIG_REALM
              valueFrom:
                configMapKeyRef:
                  name: si-env
                  key: KEYCLOAK_REALM
            - name: FWS_SIDE_NAV_MENU_SECTIONS
              valueFrom:
                configMapKeyRef:
                  name: si-env
                  key: FWS_NAV_MENU_SECTIONS
            - name: FWS_CHART_CONFIG_VULNERABILITY_TRENDS_X_AXIS_TICK_LIMIT
              value: "14"
            - name: PRODUCT_VERSION
              valueFrom:
                configMapKeyRef:
                  name: si-env
                  key: PRODUCT_VERSION
          readinessProbe:
            exec:
              command: ["curl", "-f", "http://localhost:8080/health/alive"]
            initialDelaySeconds: 20
            periodSeconds: 5
          resources:
            requests:
              cpu: "50m"
              memory: "50Mi"
            limits:
              cpu: "1"
              memory: "256Mi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: asset-management-browser
  namespace: security-intelligence
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: asset-management-browser
  template:
    metadata:
      labels:
        app.kubernetes.io/name: asset-management-browser
    spec:
      securityContext:
        runAsUser: 10022
        runAsGroup: 10022
        fsGroup: 10022
        runAsNonRoot: true
      containers:
        - name: browser
          image: packages.greenbone.net/opensight-asset/asset-management-browser:0.0.8@sha256:19021687c932f45aa96ae28ecd4159ecfd1e6fbaca430d86cedb65b0feab12e2
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            exec:
              command: ["curl", "-f", "http://localhost:9222/json/version"]
            initialDelaySeconds: 5
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: "150m"
              memory: "150Mi"
            limits:
              cpu: "1"
              memory: "500Mi"